<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='13' ry='13' fill='%233370FF'/%3E%3Ctext x='32' y='33' font-size='38' font-family='Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif' font-weight='bold' fill='%23fff' text-anchor='middle' dominant-baseline='central'%3E%E6%8B%BC%3C/text%3E%3C/svg%3E">
<title>拼音纠错练习</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1f2329; --sub:#646a73; --line:#e5e6eb;
    --blue:#3370ff; --green:#34a853; --red:#e5484d; --amber:#ff8800;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header{padding:16px 16px 10px;}
  header h1{font-size:18px; margin:0 0 4px;}
  header .stats{font-size:13px; color:var(--sub); display:flex; gap:14px;}
  header .stats b{color:var(--text);}
  .stat-right b{color:var(--green);} .stat-wrong b{color:var(--red);}

  .tabs{display:flex; gap:8px; padding:0 16px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none; padding:8px 14px; border-radius:18px; background:#fff; border:1px solid var(--line);
    font-size:14px; color:var(--sub); cursor:pointer;}
  .tab.active{background:var(--blue); color:#fff; border-color:var(--blue);}

  .filters{display:flex; flex-wrap:nowrap; gap:6px; padding:10px 16px 0; overflow-x:auto;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:none; padding:5px 11px; border-radius:14px; background:#fff; border:1px solid var(--line);
    font-size:12.5px; color:var(--sub); cursor:pointer; white-space:nowrap;}
  .chip.active{background:#e8f0ff; color:var(--blue); border-color:var(--blue);}

  .card{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:12px 20px 24px;}
  .char{font-size:88px; font-weight:700; line-height:1.1; margin-bottom:8px;}
  .hint{font-size:13px; color:var(--sub); margin-bottom:18px;}
  .input-row{width:100%; display:flex; gap:10px;}
  input#answer{flex:1; height:52px; border:1.5px solid var(--line); border-radius:14px; padding:0 16px;
    font-size:22px; letter-spacing:1px; background:#fff; outline:none;}
  input#answer:focus{border-color:var(--blue);}
  button.primary{height:52px; padding:0 20px; border:none; border-radius:14px; background:var(--blue);
    color:#fff; font-size:16px; cursor:pointer;}
  button.primary:active{opacity:.85;}

  .feedback{width:100%; margin:0 0 10px; border-radius:10px; padding:8px 12px; display:none;}
  .feedback.ok{display:block; background:#ecf9f0;}
  .feedback.no{display:block; background:#fdeeee;}
  .feedback .fb-title{font-size:15px; font-weight:600; margin:0; line-height:1.35;}
  .feedback.ok .fb-title{color:var(--green);}
  .feedback.no .fb-title{color:var(--red);}

  .actions{display:flex; gap:10px; width:100%; margin-top:16px;}
  .actions button{flex:1; height:46px; border-radius:12px; font-size:15px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--text);}
  .actions button.ghost{background:#fff;}


  /* 结果面板 */
  .panel{display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  .panel.show{display:flex;}
  .panel .big{font-size:44px; font-weight:700;}
  .panel .row{margin:10px 0; font-size:15px; color:var(--sub);}
  .panel .row b{color:var(--text);}

  /* 错题列表 */
  .wrong-list{padding:16px;}
  .wrong-item{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .wrong-item .wc{font-size:28px; font-weight:700; width:40px; text-align:center;}
  .wrong-item .wp{font-size:15px; color:var(--sub); flex:1;}
  .wrong-item .cnt{font-size:12px; color:var(--red);}

  .empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:14px;}
  .bar{height:6px; background:var(--line); border-radius:3px; margin:0 16px 6px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--blue); width:0;}

  .filterbar{display:flex; gap:8px; padding:10px 16px 0;}
  .filterbar input{flex:1; height:38px; border:1px solid var(--line); border-radius:10px; padding:0 12px; font-size:14px; outline:none; background:#fff;}
  .filterbar input:focus{border-color:var(--blue);}
  .filterbar button{height:38px; padding:0 14px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:14px; cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>拼音纠错练习<button id="logBtn" style="float:right;font-size:12px;padding:4px 10px;margin-left:6px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--sub);">日志</button><button id="settingsBtn" style="float:right;font-size:12px;padding:4px 10px;margin-left:6px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--sub);">设置</button><button id="syncBtn" style="float:right;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue);">同步</button></h1>
    <div class="stats">
      <span>范围 <b id="sScope">0</b></span>
      <span>待练 <b id="sPending">0</b></span>
      <span>进度 <b id="sProg">0/0</b></span>
    </div>
  </header>

  <div class="bar"><i id="barFill"></i></div>

  <div class="filterbar">
    <input id="filterInput" type="text" placeholder="拼音前缀过滤，如 n 或 n|r|l 或 zhan|nong|ge" autocomplete="off" spellcheck="false">
    <button id="filterClear">清除</button>
  </div>
  <div class="filters" id="filters"></div>

  <div class="card" id="practiceView">
    <div class="char" id="charEl">字</div>
    <div class="hint" id="hintEl">输入拼音后按回车提交</div>
    <div class="feedback" id="feedback"></div>
    <div class="input-row">
      <input id="answer" type="text" inputmode="latin" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" placeholder="输入拼音，回车提交">
    </div>
  </div>

  <div class="panel" id="resultView">
    <div class="big" id="resRate">0%</div>
    <div class="row" id="resRow">范围 0 字 · 全部完成</div>
    <div class="actions" style="max-width:320px">
      <button id="againBtn">再练一轮</button>
      <button class="ghost" id="toWrongBtn">待练列表</button>
    </div>
  </div>

  <div class="wrong-list" id="wrongView" style="display:none">
    <div class="actions" style="margin-bottom:14px">
      <button id="backBtn">← 返回练习</button>
      <button class="ghost" id="clearWrongBtn">清空练习</button>
    </div>
    <div id="wrongListBox"></div>
  </div>
</div>

  viewPos: 0,
  current: null,
  answered: false,
  recordMap: loadRecord(),
};
let autoNextTimer = null;

let logSeq = 0;
let latestRemoteRecord = null;
function logEvent(name, extra){
  try{
    if(window.PinyinBridge && window.PinyinBridge.log){
      window.PinyinBridge.log('['+(++logSeq)+'] '+name+(extra?' '+extra:''));
    }
  }catch(e){}
}
function visibleJson(raw){
  try{
    const obj=JSON.parse(raw || '{}'), out={};
    Object.keys(obj).forEach(function(k){
      const r=obj[k];
      if(r && !r.deleted) out[k]=r;
    });
    return JSON.stringify(out);
  }catch(e){ return '{}'; }
}
function rawProgress(){
  if(window.PinyinBridge && window.PinyinBridge.loadProgress){
    try{ return window.PinyinBridge.loadProgress() || '{}'; }catch(e){ return '{}'; }
  }
  if(latestRemoteRecord) return latestRemoteRecord;
  try{ return JSON.stringify(INITIAL_RECORD || {}); }catch(e){ return '{}'; }
}
function loadRecord(){
  let raw = {};
  try{
    const progress = rawProgress();
    raw = typeof progress === 'string' ? JSON.parse(progress || '{}') : JSON.parse(JSON.stringify(progress || {}));
  }catch(e){ raw = {}; }
  const rec = {};
  Object.keys(raw).forEach(function(k){
    const r = raw[k];
    if(!r || r.deleted) return;
    // 老格式一律丢弃，按新字处理（数据契约 v2）
    if(typeof r.remain === 'number' && r.remain >= 0){
      rec[k] = {c:r.c, t:r.t, a:r.a, i:r.i, f:r.f, remain:r.remain, updatedAt:r.updatedAt};
    }else{
      rec[k] = {c:r.c || k, t:r.t, a:r.a, i:r.i, f:r.f, remain:3};
    }
  });
  return rec;
}
function saveRecord(){
  const t0 = performance.now();
  const json = JSON.stringify(state.recordMap);
  let localMs = performance.now() - t0;
  let saveStart = 0;
  localStorage.setItem('py_record', json);
  window._saveChain = (window._saveChain || Promise.resolve()).then(function(){
    saveStart = performance.now();
    if(window.PinyinBridge) return window.PinyinBridge.saveProgress(json);
    return fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json; charset=utf-8'}, body:json});
  }).then(function(){
    logEvent('saveRecord', 'chars='+Object.keys(state.recordMap).length+
      ' localMs='+localMs.toFixed(1)+' saveMs='+(performance.now()-saveStart).toFixed(1));
  }).catch(function(e){
    logEvent('saveRecordError', String((e && e.message) || e));
  });
}

const SESSION_KEY = 'py_session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({
    filter: state.filter, viewPos: state.viewPos, queue: state.queue.map(q=>q.c)
  })); }catch(e){}
}
function restoreSession(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ s=null; }
  if(!s || !Array.isArray(s.queue) || !s.queue.length) return false;
  const byChar={}; allItems().forEach(it=>byChar[it.c]=it);
  const q=s.queue.map(c=>byChar[c]).filter(Boolean);
  if(!q.length) return false;
  state.filter=s.filter||'all'; state.queue=q;
  state.viewPos=Math.min(Math.max(s.viewPos||0,0), q.length-1);
  return true;
}

function ensureRecord(it){
  let r=state.recordMap[it.c];
  if(!r){ r={c:it.c,t:it.t,a:it.a,i:it.i,f:it.f,remain:3}; state.recordMap[it.c]=r; }
  if(typeof r.remain!=='number' || r.remain<0) r.remain=3;
  return r;
}

/* ---------- 数据 / 过滤 ---------- */
const ALL_ITEMS = (function(){
  const out=[];
  GROUP_KEYS.forEach(k=>DATA[k].items.forEach(it=>out.push(Object.assign({_g:k},it))));
  return out;
})();
function allItems(){ return ALL_ITEMS; }
function filterTokens(){
  if(!state.filter || state.filter==='all') return null;
  const t=state.filter.split('|').map(x=>x.trim().toLowerCase()).filter(Boolean);
  return t.length ? t : null;
}
/* 拼音前缀匹配：a 为不带声调读音数组 */
function matchFilter(it){
  const toks=filterTokens();
  if(!toks) return true;
  const py=(it.a||[]).map(x=>String(x).toLowerCase());
  return py.some(p=>toks.some(t=>p.indexOf(t)===0));
}
let scopeCacheKey = null;
let scopeCache = [];
function scopeItems(){
  const key=state.filter || 'all';
  if(scopeCacheKey === key) return scopeCache;
  const out=ALL_ITEMS.filter(matchFilter);
  const seen=new Set();
  scopeCacheKey = key;
  scopeCache = out.filter(it=>seen.has(it.c)?false:seen.add(it.c));
  return scopeCache;
}
function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}

/* onlyPending=true：只取待练字，一轮能走完；false：首次/切过滤，混入少量已完成字抽查 */
function buildQueue(onlyPending){
  const scope=scopeItems();
  const pending=scope.filter(it=>ensureRecord(it).remain>0);
  shuffleArr(pending);
  if(onlyPending){
    state.queue=pending;
  }else{
    const done=scope.filter(it=>ensureRecord(it).remain===0);
    shuffleArr(done);
    state.queue=pending.concat(done.slice(0, Math.min(done.length,12)));
  }
  state.viewPos=0;
}

function pendingInScope(){ return scopeItems().filter(it=>ensureRecord(it).remain>0).length; }

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);

function renderFilterBar(){
  const presets=[['all','全部'],['z|zh|c|ch|s|sh','平翘舌'],['n|l|r','鼻边音'],['g|k|h','舌根音'],['en|eng|in|ing','前后鼻韵']];
  $('filters').innerHTML=presets.map(p=>
    `<div class="chip ${state.filter===p[0]?'active':''}" data-f="${p[0]}">${p[1]}</div>`).join('');
  document.querySelectorAll('.chip').forEach(el=>el.onclick=()=>setFilter(el.dataset.f));
}
function setFilter(f){
  const t0=performance.now();
  state.filter=f||'all';
  $('filterInput').value=state.filter==='all'?'':state.filter;
  renderFilterBar();
  buildQueue(false);
  $('resultView').classList.remove('show');
  $('wrongView').style.display='none';
  $('practiceView').style.display='flex';
  updateStats();
  showCard();
  logEvent('filter', 'value='+state.filter+' scope='+scopeItems().length+' ms='+(performance.now()-t0).toFixed(1));
}

function nextInView(from){
  for(let i=from;i<state.queue.length;i++){ if(matchFilter(state.queue[i])) return i; }
  return -1;
}
function clearAutoNext(){
  if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer=null; }
}
function showCard(){
  clearAutoNext();
  const hit=nextInView(state.viewPos);
  if(hit<0){ showDone(); return; }
  state.viewPos=hit;
  state.current=state.queue[hit];
  state.answered=false;
  $('charEl').textContent=state.current.c;
  $('hintEl').textContent=`输入拼音（不带声调）· 回车提交 · 还需练 ${ensureRecord(state.current).remain} 次`;
  $('answer').value='';
  $('feedback').className='feedback'; $('feedback').innerHTML='';
  $('answer').disabled=false;
  updateStats();
  setTimeout(()=>$('answer').focus(),50);
}
function updateStats(){
  const scope=scopeItems();
  const done=scope.filter(it=>ensureRecord(it).remain===0).length;
  const pending=scope.length-done;
  $('sScope').textContent=scope.length;
  $('sPending').textContent=pending;
  $('sProg').textContent=done+'/'+scope.length;
  $('barFill').style.width=scope.length?(done/scope.length*100)+'%':'0';
  saveSession();
}
/* 间隔重复：remain 越小说明越熟练，重复间隔越长；小范围过滤时按范围上限收敛 */
function repeatGap(remain){
  const cap=Math.max(16, Math.floor(scopeItems().length*0.6));
  let lo, span;
  if(remain>=4){ lo=10; span=7; }
  else if(remain===3){ lo=18; span=11; }
  else if(remain===2){ lo=36; span=17; }
  else{ lo=72; span=25; }
  return Math.min(cap, lo+Math.floor(Math.random()*span));
}
function requeue(it){
  const at=state.viewPos;
  state.queue=state.queue.filter((q,i)=>!(i>at && q.c===it.c));
  const gap=repeatGap(ensureRecord(it).remain);
  state.queue.splice(Math.min(at+1+gap,state.queue.length),0,it);
  return gap;
}
function dropAfter(it){
  const at=state.viewPos;
  state.queue=state.queue.filter((q,i)=>!(i>at && q.c===it.c));
}

function submit(){
  const t0=performance.now();
  if(!state.current || state.answered) return;
  const input=norm($('answer').value);
  if(!input) return;
  const it=state.current, r=ensureRecord(it);
  const ok=it.a.map(x=>norm(x)).some(a=>a===input || a.indexOf(input)===0);
  const judgeMs=performance.now()-t0;
  state.answered=true;
  const fb=$('feedback');
  let gap=0;
  if(ok){
    r.remain=Math.max(0, r.remain-1);
    if(r.remain===0) dropAfter(it);
    else gap=requeue(it);
    saveRecord();
    fb.className='feedback ok';
    fb.innerHTML=`<div class="fb-title">✓ 正确 · 还需 ${r.remain} 次</div>`;
    autoNextTimer=setTimeout(()=>{ autoNextTimer=null; next(); }, 350);
  }else{
    r.remain=Math.max(3, r.remain+1);
    saveRecord();
    gap=requeue(it);
    fb.className='feedback no';
    fb.innerHTML=`<div class="fb-title">✗ 正确：${it.a.join(' / ')}</div>`;
  }
  const tStats=performance.now();
  updateStats();
  const statsMs=performance.now()-tStats;
  logEvent('answer', 'char='+it.c+' ok='+ok+' remain='+r.remain+' gap='+gap+
    ' judgeMs='+judgeMs.toFixed(1)+' statsMs='+statsMs.toFixed(1)+' totalMs='+(performance.now()-t0).toFixed(1));
}
function next(){
  clearAutoNext();
  state.viewPos++;
  if(state.viewPos>=state.queue.length){
    // 一轮走完：还有待练字就只取它们继续，全完成才显示完成页
    if(pendingInScope()>0){ buildQueue(true); }
    else{ showDone(); return; }
  }
  showCard();
}
function norm(s){ return (s||'').toLowerCase().replace(/[^a-z]/g,''); }

function showDone(){
  const scope=scopeItems();
  const pending=scope.filter(it=>ensureRecord(it).remain>0);
  $('practiceView').style.display='none';
  $('wrongView').style.display='none';
  $('resultView').classList.add('show');
  if(pending.length){
    $('resRate').textContent=pending.length+' 字待练';
    $('resRow').textContent='范围 '+scope.length+' 字 · 还剩 '+pending.length+' 字未完成';
  }else{
    $('resRate').textContent='100%';
    $('resRow').textContent='范围 '+scope.length+' 字 · 全部完成';
  }
}
function clearScopePractice(){
  const chars=new Set(scopeItems().map(it=>it.c));
  Object.keys(state.recordMap).forEach(c=>{ if(chars.has(c)) delete state.recordMap[c]; });
  saveRecord();
}
function renderPending(){
  const list=scopeItems().filter(it=>ensureRecord(it).remain>0);
  $('wrongView').style.display='block';
  $('practiceView').style.display='none';
  $('resultView').classList.remove('show');
  if(!list.length){ $('wrongListBox').innerHTML='<div class="empty">暂无待练习 🎉</div>'; return; }
  $('wrongListBox').innerHTML=list.map(e=>`<div class="wrong-item"><div class="wc">${e.c}</div><div class="wp">${e.t.join(' / ')}
    <div class="alt" style="margin-top:4px">还需 ${ensureRecord(e).remain} 次</div></div></div>`).join('');
}
function backToPractice(){
  $('wrongView').style.display='none';
  $('resultView').classList.remove('show');
  $('practiceView').style.display='flex';
  // 清空练习或一轮结束后 viewPos 可能在队尾，重建队列才能回到练习
  if(!state.queue.length || state.viewPos>=state.queue.length) buildQueue(false);
  showCard();
}
function startRound(){
  const pending=pendingInScope();
  buildQueue(pending>0);   // 有待练字只练待练；全完成则抽查
  $('resultView').classList.remove('show');
  $('wrongView').style.display='none';
  $('practiceView').style.display='flex';
  updateStats(); showCard();
}
function init(){
  const saved=restoreSession();
  if(!localStorage.getItem('py_record')) localStorage.setItem('py_record', JSON.stringify(INITIAL_RECORD||{}));
  $('filterInput').value=state.filter==='all'?'':state.filter;
  renderFilterBar();
  if(!saved) buildQueue(false);
  else if(!state.queue.length) buildQueue(false);
  $('resultView').classList.remove('show');
  $('wrongView').style.display='none';
  $('practiceView').style.display='flex';
  updateStats(); showCard();
}

window.onProgressSynced = function(){
  const t0=performance.now();
  try{
    state.recordMap=loadRecord();
    buildQueue(false);
    $('resultView').classList.remove('show');
    $('wrongView').style.display='none';
    $('practiceView').style.display='flex';
    updateStats(); showCard();
    logEvent('progressSynced', 'chars='+Object.keys(state.recordMap).length+
      ' ms='+(performance.now()-t0).toFixed(1));
  }catch(e){
    logEvent('progressSyncError', String((e && e.message) || e));
  }
};

if(!window.PinyinBridge && location.protocol.indexOf('http')===0){
  setInterval(function(){
    fetch('/api/progress').then(function(r){ return r.json(); }).then(function(remote){
      const raw=JSON.stringify(remote);
      if(visibleJson(raw) === JSON.stringify(state.recordMap)) return;
      latestRemoteRecord = raw;
      logEvent('remoteProgressChanged', 'bytes='+raw.length);
      window.onProgressSynced();
    }).catch(function(){});
  }, 5000);
}

/* ---------- 事件 ---------- */
$('answer').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  e.preventDefault();
  if(state.answered) next(); else submit();
});
$('againBtn').onclick=startRound;
$('toWrongBtn').onclick=renderPending;
$('backBtn').onclick=backToPractice;
$('clearWrongBtn').onclick=()=>{
  clearScopePractice();
  renderPending(); updateStats();
};
$('filterInput').addEventListener('change', ()=>setFilter($('filterInput').value));
$('filterInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); setFilter($('filterInput').value); } });
$('filterClear').onclick=()=>setFilter('all');
if($('logBtn')) $('logBtn').onclick=()=>window.PinyinBridge.showLogs();

$('syncBtn').onclick = () => window.PinyinBridge.syncNow(); $('settingsBtn').onclick = () => window.PinyinBridge.openSettings();
init();
</script>
</body>
</html>
